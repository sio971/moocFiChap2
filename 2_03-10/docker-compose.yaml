services:
  backend:
    image: chrisbb971/backend
    ports:
      - 8080:8080
    environment:
      - REQUEST_ORIGIN=http://localhost:5001
    container_name: backend
    
  frontend:
    image: chrisbb971/frontend 
    ports:
      - 5001:5001
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8080
    container_name: frontend
